<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoTrade Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --text-main: #ffffff;
            --text-secondary: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 0 4px;
        }

        .logo-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .balance-card {
            background: var(--card-gradient, linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(139, 92, 246, 0.15) 100%));
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .balance-title {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
            margin-left: 4px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
        }

        .asset-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .asset-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(59, 130, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .asset-name {
            font-weight: 600;
            font-size: 16px;
        }

        .asset-price {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .btn-buy {
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-buy:active {
            opacity: 0.8;
            transform: scale(0.97);
        }

        .portfolio-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .mini-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }

        .mini-card-title {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .mini-card-value {
            font-size: 18px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-title">⚡️ CryptoTrade</div>
    </div>

    <div class="balance-card">
        <div class="balance-title">Общий баланс</div>
        <div class="balance-amount" id="balance">1,000.00</div>
    </div>

    <div class="section-title">Рынок активов</div>

    <div class="card">
        <div class="asset-info">
            <div class="asset-icon">🚀</div>
            <div>
                <div class="asset-name">Криптомем</div>
                <div class="asset-price">100 кредитов</div>
            </div>
        </div>
        <button class="btn-buy" onclick="buyAsset()">Купить</button>
    </div>

    <div class="section-title">Портфель</div>
    <div class="portfolio-stats">
        <div class="mini-card">
            <div class="mini-card-title">Активов куплено</div>
            <div class="mini-card-value" id="portfolio">0</div>
        </div>
        <div class="mini-card">
            <div class="mini-card-title">Доходность</div>
            <div class="mini-card-value" style="color: #4ade80;">+0.0%</div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 1000;
        let assetsCount = 0;

        function buyAsset() {
            const price = 100;
            if (balance >= price) {
                balance -= price;
                assetsCount += 1;
                document.getElementById("balance").innerText = balance.toLocaleString() + ".00";
                document.getElementById("portfolio").innerText = assetsCount;
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('medium');
                }
            } else {
                tg.showAlert("Недостаточно кредитов! Пополни баланс через бота.");
            }
        }
    </script>
</body>
</html>
