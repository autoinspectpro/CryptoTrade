<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Биржа Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #1e1e1e);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>📈 Биржевой Симулятор</h1>
    <div class="card">
        <h3>Твой баланс</h3>
        <p id="balance">0 кредитов</p>
    </div>
    <div class="card">
        <h3>Рынок</h3>
        <p>Криптомем: 100 кредитов</p>
        <button onclick="buyAsset()">Купить актив</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function buyAsset() {
            alert("Покупка совершена!");
        }
    </script>
</body>
</html>
