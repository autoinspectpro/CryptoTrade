<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoTrade Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0B0E14;
            --card-bg: #141922;
            --accent: #6C5CE7;
            --text: #FFFFFF;
            --text-sec: #A0AEC0;
            --green: #00B894;
        }
        body {
            font-family: system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0; padding: 16px;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .balance-card { background: var(--card-bg); padding: 20px; border-radius: 16px; text-align: center; border: 1px solid #2D3748; }
        .balance { font-size: 28px; font-weight: bold; color: var(--green); }
        .btn-dep { background: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .market-grid { display: grid; gap: 12px; margin-top: 20px; }
        .asset-card { background: var(--card-bg); padding: 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .asset-info h4 { margin: 0; font-size: 16px; }
        .asset-info p { margin: 4px 0 0; font-size: 12px; color: var(--text-sec); }
        .forecast { font-size: 12px; color: var(--green); font-weight: bold; }
        .buy-btn { background: #2D3748; color: var(--text); border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .buy-btn:active { background: var(--accent); }
    </style>
</head>
<body>

<div class="header">
    <div>
        <h2 style="margin:0;">CryptoTrade</h2>
        <span style="font-size: 12px; color: var(--text-sec);">Симулятор биржи</span>
    </div>
    <button class="btn-dep" onclick="openDeposit()">Пополнить</button>
</div>

<div class="balance-card">
    <div style="font-size: 14px; color: var(--text-sec);">Ваш баланс</div>
    <div class="balance"><span id="balance">1000.00</span> CRD</div>
</div>

<div class="market-grid" id="market">
    <!-- Скрипт заполнит рынок -->
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    // Загружаем данные из памяти или ставим начальные
    let balance = parseFloat(localStorage.getItem('balance')) || 1000.00;
    let assetsCount = parseInt(localStorage.getItem('assetsCount')) || 0;

    const assets = [
        { name: "Bitcoin", price: 500, change: "+5.4% к росту", icon: "🪙" },
        { name: "Ethereum", price: 300, change: "+3.2% к росту", icon: "💎" },
        { name: "Solana", price: 100, change: "-1.5% коррекция", icon: "☀️" },
        { name: "MemeCoin", price: 50, change: "⚠️ Высокий риск", icon: "🐶" }
    ];

    function renderMarket() {
        const container = document.getElementById('market');
        container.innerHTML = assets.map((a, index) => `
            <div class="asset-card">
                <div style="font-size: 24px;">${a.icon}</div>
                <div class="asset-info" style="flex-grow: 1; margin-left: 12px;">
                    <h4>${a.name}</h4>
                    <p>${a.price} CRD • <span class="forecast">${a.change}</span></p>
                </div>
                <button class="buy-btn" onclick="buyAsset(${index})">Купить</button>
            </div>
        `).join('');
    }

    function saveデータ() {
        localStorage.setItem('balance', balance);
        localStorage.setItem('assetsCount', assetsCount);
    }

    function buyAsset(index) {
        const asset = assets[index];
        if (balance >= asset.price) {
            balance -= asset.price;
            assetsCount += 1;
            document.getElementById('balance').innerText = balance.toFixed(2);
            saveデータ(); // Сохраняем прогресс
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            tg.showAlert(`Вы успешно приобрели ${asset.name}! Всего куплено: ${assetsCount}`);
        } else {
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            tg.showAlert("Недостаточно средств. Нажмите 'Пополнить' для покупки кредитов.");
        }
    }

    function openDeposit() {
        // Отправляет команду боту, чтобы он прислал ссылку на оплату
        tg.sendData('/deposit');
        tg.close(); // Закрываем Mini App, чтобы пользователь перешел в чат к боту
    }

    document.getElementById('balance').innerText = balance.toFixed(2);
    renderMarket();
</script>
</body>
</html>
